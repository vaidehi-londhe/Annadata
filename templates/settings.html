<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | Annadata</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="phone-container profile-page">

    <header class="top-bar">
        <a href="{{ url_for('profile') }}" class="icon-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 style="margin:0; font-size:20px;">Settings</h1>
        <span style="width:48px;"></span>
    </header>

    <div class="account-row" style="cursor:pointer;">
        <div class="account-icon">
            <i class="fa-solid fa-bell"></i>
        </div>
        <span>Scheme update notifications</span>
        <label class="settings-switch">
            <input type="checkbox" id="notif-toggle">
            <span class="settings-slider"></span>
        </label>
    </div>

    <div class="account-row" style="cursor:pointer;">
        <div class="account-icon">
            <i class="fa-solid fa-language"></i>
        </div>
        <span>App Language</span>
        <select id="lang-select" style="border:none; background:transparent; font-size:15px; color:#2f6b1f; font-weight:600;">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
        </select>
    </div>

</div>

<style>
.settings-switch { position:relative; display:inline-block; width:44px; height:24px; }
.settings-switch input { opacity:0; width:0; height:0; }
.settings-slider { position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:24px; transition:.2s; }
.settings-slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
.settings-switch input:checked + .settings-slider { background:#2f6b1f; }
.settings-switch input:checked + .settings-slider:before { transform:translateX(20px); }
</style>

<script>
const notifToggle = document.getElementById('notif-toggle');
const langSelect = document.getElementById('lang-select');

notifToggle.checked = localStorage.getItem('notif_pref') !== 'off';
langSelect.value = localStorage.getItem('app_lang') || 'en';

notifToggle.addEventListener('change', function () {
    localStorage.setItem('notif_pref', this.checked ? 'on' : 'off');
});

langSelect.addEventListener('change', function () {
    localStorage.setItem('app_lang', this.value);
});
</script>

</body>
</html>
