<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Annadata</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="login-container">

        <div class="header">

        <div class="logo">

            <i class="fa-solid fa-seedling"></i>

            <h1>ANNADATA</h1>

            <h2>अन्नदाता</h2>

        </div>

    </div>

    <div class="form-container">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your mobile number and set a new password</p>

        {% if error %}
        <p style="color:#c0392b; font-size:14px; margin-bottom:10px;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="text" name="phone" placeholder="Mobile Number" required>
            </div>

            <div class="input-box password-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="New Password" required>
            </div>

            <div class="input-box password-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            </div>

            <button type="submit" class="login-btn">Reset Password</button>
        </form>

        <div class="divider"><span></span></div>

        <a href="{{ url_for('login') }}" class="signup-card">
            <div class="card-icon"><i class="fa-solid fa-arrow-left"></i></div>
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
